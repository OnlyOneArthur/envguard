[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard"
version = "0.1.0"
description = "Secrets scanner for Git repositories — regex + entropy detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
envguard = "envguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
